{% extends "base.html" %}
{% block title %}Новый вопрос{% endblock %}
{% block content %}
<h1>Новый вопрос</h1>
<form class="card" method="post">
  <label>Заголовок</label>
  <input type="text" name="title" value="{{ request.form.title }}" required>
  <label>Описание</label>
  <textarea name="description" required>{{ request.form.description }}</textarea>
  <label>Теги</label>
  <input type="text" name="tags" value="{{ request.form.tags }}" placeholder="Добавить теги через запятую: java, spring" required>
  <div class="row" style="margin-top: 16px">
    <button class="btn">Опубликовать</button>
    <a class="btn ghost" href="{{ url_for('feed') }}">Отмена</a>
  </div>
</form>
{% endblock %}
